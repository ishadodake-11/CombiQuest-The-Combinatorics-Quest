<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CombiQuest</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head><body><div class="wrap">
<header><div><h1>Combi<b>Quest</b></h1></div>
<div><div class="sm"><b id="rk"></b> · <span id="xp"></span> XP · <span id="sk"></span>-day streak <button id="mu" style="padding:2px 8px;font-size:11px">SND</button></div><div class="bar"><i id="xb"></i></div></div></header>
<nav><button id="nm" class="on">Play</button><button id="nw">Workshop</button><button id="nt">Theory</button><button id="ne">Tests</button></nav>
<div id="map"></div><div id="bat" hidden></div>
<div id="lab" hidden>
<div class="row"><button class="tb2 on" data-t="t1">Count</button><button class="tb2" data-t="t2">Pigeon</button><button class="tb2" data-t="t3">Recurrence</button></div>
<div class="pn tp" id="t1"><h2>Counting solver</h2><div class="row"><div><label>n</label><input id="wn" type="number" value="8"></div><div><label>r</label><input id="wr" type="number" value="3"></div></div><label>Type</label><select id="wm"><option value="P">P(n,r) · permutation</option><option value="C">C(n,r) · combination</option><option value="PR">n^r · permutation with repetition</option><option value="CR">C(n+r−1,r) · combination with repetition</option></select><div class="row"><button class="pri" id="wc">Solve</button></div><div class="out" id="o1"></div></div>
<div class="pn tp" id="t2" hidden><h2>Pigeonhole</h2><div class="row"><div><label>Items N</label><input id="pn" type="number" value="25"></div><div><label>Boxes k</label><input id="pk" type="number" value="6"></div><div><label>Limit m</label><input id="pm" type="number" value="5"></div></div><div class="row"><button class="pri" id="pc">Solve</button></div><div class="out" id="o2"></div></div>
<div class="pn tp" id="t3" hidden><h2>Recurrence solver</h2><div class="sm">a(n) = c1·a(n−1) + c2·a(n−2)</div><div class="row"><div><label>c1</label><input id="c1" type="number" value="1"></div><div><label>c2</label><input id="c2" type="number" value="1"></div><div><label>a0</label><input id="a0" type="number" value="0"></div><div><label>a1</label><input id="a1" type="number" value="1"></div></div><div class="row"><button class="pri" id="rc">Solve</button></div><div class="out" id="o3"></div></div>
</div><div id="theory" hidden></div><div id="tests" hidden></div></div><div id="ov"></div>
<script src="js/math-engine.js"></script>
<script src="js/storage.js"></script>
<script src="js/game.js"></script>
<script src="js/workshop.js"></script>
<script src="tests/test-cases.js"></script>
<script src="tests/test-runner.js"></script>
<script src="js/docs-ui.js"></script>
<script src="js/app.js"></script>
</body></html>
